<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ویجت SRJ - وضعیت و KPI زنده</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0097cc">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#0097cc; --success:#16a34a; --warning:#d97706; --bg:#0f172a; --card:#1e293b; --border:#334155; }
  *{ box-sizing:border-box; font-family:'Vazirmatn',sans-serif !important; margin:0; padding:0; }
  body{ background:var(--bg); color:#f1f5f9; min-height:100vh; padding:14px; max-width:420px; margin:0 auto; }
  .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .brand{ font-weight:900; color:var(--accent); font-size:1rem; }
  .clock{ font-size:0.75rem; color:#94a3b8; direction:ltr; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px; }
  .name{ font-weight:800; font-size:0.95rem; }
  .role{ font-size:0.72rem; color:#94a3b8; margin-top:2px; }
  .status-line{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:0.8rem; }
  .conn{ font-size:0.68rem; }
  .kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .kpi-box{ background:#0f172a; border:1px solid var(--border); border-radius:12px; padding:8px; text-align:center; }
  .kpi-box .lbl{ font-size:0.65rem; color:#94a3b8; }
  .kpi-box .val{ font-size:1.05rem; font-weight:900; margin-top:2px; direction:ltr; }
  .val.approved{ color:#4ade80; }
  .val.pending{ color:#fbbf24; }
  .btn{ display:block; width:100%; text-align:center; background:var(--accent); color:#fff; border:none; padding:12px; border-radius:12px; font-weight:800; font-size:0.85rem; margin-top:10px; text-decoration:none; }
  .btn.secondary{ background:#334155; }
  .muted{ color:#94a3b8; font-size:0.75rem; text-align:center; padding:20px 0; }
  a{ color:var(--accent); }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">SRJ · ویجت زنده</div>
    <div class="clock" id="w-clock">--:--:--</div>
  </div>

  <div id="w-content"><div class="muted">در حال بارگذاری...</div></div>

  <script>
    const GH_CFG_KEY = 'srj_gh_config_v1';
    const SESSION_KEY = 'srj_staff_session_v1';

    function esc(v){ return (v===null||v===undefined)?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function ghConfig(){ try { return JSON.parse(localStorage.getItem(GH_CFG_KEY)||'null'); } catch(e){ return null; } }
    function b64DecodeUtf8(str){ return decodeURIComponent(escape(atob(str.replace(/\n/g,'')))); }
    function todayFa(){ return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }

    async function ghFetchFile(){
      const cfg = ghConfig();
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURI(cfg.path)}?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
      const res = await fetch(url, { headers: { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' } });
      if (!res.ok) throw new Error('کد ' + res.status);
      const json = await res.json();
      return JSON.parse(b64DecodeUtf8(json.content));
    }

    function render(DB, user){
      const logs = (DB.worklogs||[]).filter(l => l.user === user.username);
      const ot = (DB.ot||[]).filter(o => o.user === user.username);
      const t = todayFa();
      const todayLog = logs.find(l => l.date === t);

      const workApproved = logs.filter(l => l.status==='حضور' && l.approval==='approved').length;
      const workPending = logs.filter(l => l.status==='حضور' && l.approval==='pending').length;
      let otApproved = 0, otPending = 0;
      logs.forEach(l => { if (l.otHours){ if (l.approval==='approved') otApproved += parseFloat(l.otHours); else otPending += parseFloat(l.otHours); } });
      ot.forEach(o => { if (o.status.includes('تایید شده')) otApproved += parseFloat(o.hours); else otPending += parseFloat(o.hours); });

      let statusText = 'هنوز امروز ثبت تردد نکرده‌اید';
      if (todayLog && todayLog.start && !todayLog.end) statusText = '🟢 در حال حضور (ورود: ' + esc(todayLog.start) + ')';
      else if (todayLog && todayLog.end) statusText = '✓ شیفت امروز تکمیل شد (' + esc(todayLog.start) + ' الی ' + esc(todayLog.end) + ')';

      document.getElementById('w-content').innerHTML = `
        <div class="card">
          <div class="name">${esc(user.name)}</div>
          <div class="role">${esc(user.roleTitle||'')} · ${esc(user.personnelNo||'')}</div>
          <div class="status-line"><span>${statusText}</span></div>
          <div class="status-line"><span class="conn" id="w-conn">🟢 بروزرسانی: ${new Date().toLocaleTimeString('en-US',{hour12:false})}</span></div>
        </div>
        <div class="card">
          <div style="font-size:0.78rem; font-weight:800; margin-bottom:4px;">📊 KPI ماهانه</div>
          <div class="kpi-grid">
            <div class="kpi-box"><div class="lbl">حضور تاییدشده</div><div class="val approved">${workApproved} روز</div></div>
            <div class="kpi-box"><div class="lbl">حضور در انتظار</div><div class="val pending">${workPending} روز</div></div>
            <div class="kpi-box"><div class="lbl">اضافه‌کار تاییدشده</div><div class="val approved">${otApproved} ساعت</div></div>
            <div class="kpi-box"><div class="lbl">اضافه‌کار در انتظار</div><div class="val pending">${otPending} ساعت</div></div>
          </div>
          <a class="btn" href="./SRJ_Personnel_App.html?view=punch">📱 باز کردن برنامه (ثبت تردد)</a>
          <a class="btn secondary" href="./SRJ_Personnel_App.html?view=profile">👤 مشاهده کارکرد کامل</a>
        </div>
      `;
    }

    async function boot(){
      setInterval(() => { document.getElementById('w-clock').innerText = new Date().toLocaleTimeString('en-US',{hour12:false}); }, 1000);
      const cfg = ghConfig();
      const sess = localStorage.getItem(SESSION_KEY);
      if (!cfg || !sess) {
        document.getElementById('w-content').innerHTML = '<div class="muted">ابتدا یک‌بار از برنامه اصلی SRJ پرسنل وارد شوید تا این ویجت اطلاعات شما را نشان دهد.<br><br><a href="./SRJ_Personnel_App.html">باز کردن برنامه اصلی</a></div>';
        return;
      }
      try {
        const DB = await ghFetchFile();
        const user = (DB.users||[]).find(u => u.username === sess);
        if (!user) { document.getElementById('w-content').innerHTML = '<div class="muted">کاربر یافت نشد، دوباره وارد برنامه اصلی شوید.</div>'; return; }
        render(DB, user);
        setInterval(async () => {
          try { const fresh = await ghFetchFile(); render(fresh, user); }
          catch(e) { const c = document.getElementById('w-conn'); if (c) c.innerText = '🔴 عدم اتصال'; }
        }, 20000);
      } catch(e) {
        document.getElementById('w-content').innerHTML = '<div class="muted">خطا در اتصال به گیت‌هاب: ' + esc(e.message) + '</div>';
      }
    }
    window.onload = boot;
  </script>
</body>
</html>
